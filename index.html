<!DOCTYPE html>
<html>
<head>
  <title>Light Pollution Awareness</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    a, button, .card {
      color: #fff;
    }

    button {
      background: #222;
      border: 1px solid #555;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #333;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .card {
      background: #111;
      border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.05);
      padding: 1rem 1.25rem;
      width: 250px;
      text-align: left;
    }

    .card h3 {
      margin-top: 0;
      font-size: 1rem;
    }

    .hero-image {
      max-width: 100%;
      border-radius: 16px;
      margin: 1.5rem auto;
      display: block;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
    }

    .hero {
      position: relative;
      display: inline-block;
      width: 100%;
      text-align: left;
      margin: 0 auto;
    }

    .hero-text {
      position: absolute;
      left: 2rem;
      top: 15%;
      transform: translateY(0);
      color: #fff;
      font-size: clamp(1.8rem, 3vw, 3rem);
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-shadow: 0 8px 20px rgba(0, 0, 0, 0.65);
      max-width: 28rem;
      font-family: 'Arial Black', 'Helvetica Bold', Arial, sans-serif;
    }

    .hero-text span {
      display: block;
    }

    .hero-text .gold {
      color: #f6c945;
      display: inline;
    }

    .hero-subtext {
      margin-top: 0.5rem;
      font-size: clamp(0.75rem, 1vw, 0.95rem);
      font-weight: 100;
      line-height: 1.4;
      max-width: 22rem;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.9);
      text-transform: none;
    }

    .hero-image {
      max-width: 100%;
      border-radius: 16px;
      margin: 1.5rem auto;
      display: block;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
    }

  </style>
</head>
<body>
  <div class="hero">
    <img src="images/jonny-gios-qtpQOpdW86o-unsplash.jpg" alt="Night sky with city lights" class="hero-image">
    <div class="hero-text">
      <span>PROTECT</span>
      <span>OUR <span class="gold">NIGHT SKIES</span></span>
      <div class="hero-subtext">
        <div>Light pollution steals the skies.</div>
        <div>Let's shine a light on the solution.</div>
      </div>
    </div>
  </div>
</body>
</html>
